[input]
karabiner = true       # use the virtual keyboard when it is present, including after a later install
tap_max_ms = 200       # max hold (ms) that still counts as an alone-tap for grid/free mode
mode_timeout_s = 10     # exit grid/free/hint after N seconds idle; 0 = never
center_on_focus = true  # move the pointer to the center of a newly focused window when it is outside that window

[log]
level = "none"         # none | error | warn | info | debug


[grid]
rows = 10
cols = 10
sub_rows = 7       # second grid, and the third when depth is 3
sub_cols = 7
sub_font_size = 16
sub_label = "#FFFFFF"
sub_glow = "#FFFFFF"
sub_glow_radius = 8
chars = "'yfgcrlidhtns"  # top row, then home row, without , . p o e u a
depth = 2          # 1...3
selection_dim = "#00000080"   # unselected area; "#00000000" turns the darken off
selection_blur = 12           # points of behind-window blur on that area; 0 turns blur off
font = "system"          # PostScript name, or "system" for SF Mono
label_outline = "#000000"       # stroke around cell letters; "#00000000" or width 0 turns it off
label_outline_width = 2     # points

[free]
speed = 2000.0       # top pointer speed, points per second
accel = "glide"      # linear | diagonal | glide | custom; pointer and scroll
accel_seconds = 3.5  # seconds that curve runs for both
fast_multiplier = 3.0
slow_multiplier = 0.25
scroll_speed = 200.0  # top scroll lines per second; ramps on that curve
scroll_reverse_x = true  # flip left/right
scroll_reverse_y = false  # flip up/down
exit_on_action = false  # chord, click, or other key leaves free mode
halo_attention = "pulse"   # none | pulse | ping | breathe
halo_attention_period = 1.4  # seconds
halo_attention_scale = 3.6
halo_offset = [25.0, -25.0]  # cartesian points from the pointer; +x right, +y up

[hint]
scan_settle_ms = 200   # pause (ms) after enabling accessibility, before reading the window. Electron apps such as Obsidian need this. 0 reads immediately. Does not extend the scan timeout.
refresh_ms = [500, 1000, 1500]  # show labels at each time if nothing has been typed. The last value is the scan timeout.

[colors]
background = "#00000000"
line = "#FFFFFF"
label = "#FFFFFF"
highlight = "#FFFFFF"
grid_blend = "exclusion"   # exclusion | difference | normal | colorBurn | plusLighter
free_dot = "#FFFFFF"
free_dot_halo = "#FFFFFF99"  # translucent white stays visible with exclusion blending
free_dot_blend = "exclusion"   # exclusion | difference | normal | colorBurn | plusLighter
hint_fill = "#111111EE"
hint_text = "#FFFFFF"
hint_line = "#FFFFFFCC"
hint_highlight = "#34C759"  # box around the selected hint

# Shortcuts are case-insensitive.
# One key, or modifiers plus one key joined by +.
# Tap versus hold belongs to the action: grid_mode taps command_left, faster holds z.
#
# Modifiers. Bare command means either side. Left and right are separate keys.
#   command, command_left, command_right (cmd)
#   option, option_left, option_right (opt, alt)
#   shift, shift_left, shift_right
#   control, control_left, control_right (ctrl)
#   fn
#
# Special keys.
#   space, return, escape, tab
#   delete and backspace are the Mac Delete key. forward_delete is the other one.
#   left, right, up, down
#   home, end, page_up, page_down
#   f1 through f20
#   a letter a-z, a digit 0-9, or one mark: , . / ; ' [ ] \ - =
#
# Combos. Modifiers in any order, exactly one non-modifier.
#   command+shift and h+j are invalid.
#   command_left                 opens the grid
#   option_left                  opens free mode
#   command+shift+space          opens hint mode
#   ["h", "left"]                one action, two shortcuts
#   shift+tab                    a combo
#   ","                          the comma key
[bindings.global]
grid_mode = ["command_left"]          # tap to toggle
free_mode = ["option_left"]           # tap
hint_mode = ["command+shift+space"]

[bindings.grid]
back = ["delete", "backspace"]
left_click = ["u", "space", "return"]           # physical F; held ⌘ ⌥ ⌃ ⇧ pass through
right_click = ["e"]          # physical D
middle_click = ["o"]         # physical S
move_only = ["a"]            # physical A; exit, move the cursor, do not click
toggle_drag = ["p"]          # physical R
toggle_right_drag = ["."]    # physical E
toggle_middle_drag = [","]   # physical W
to_free = ["option_left"]
cancel = ["escape"]
next_screen = ["tab"]

[bindings.free]
move_left = ["h", "left"]
move_down = ["t", "down"]
move_up = ["n", "up"]
move_right = ["s", "right"]
faster = [";"]                  # hold
slower = ["q"]                  # hold
scroll_left = ["m"]
scroll_down = ["w"]
scroll_up = ["v"]
scroll_right = ["z"]
toggle_drag = ["p"]
toggle_right_drag = ["."]
toggle_middle_drag = [","]
left_click = ["u", "space", "return"]
right_click = ["e"]
middle_click = ["o"]
cancel = ["escape"]

[bindings.hint]
left_click = ["space", "return"]                # armed hint: click and exit
right_click = ["control+space", "control+return"]  # selected hint: right click and exit
to_free = ["option_left"]             # armed hint: move there and enter free mode
cancel = ["escape"]
back = ["delete", "backspace"]
